[project]
name = "courthoops"
version = "0.1.0"
description = "HS to College basketball simulation with clean architecture."
authors = [{ name = "Courthoops", email = "dev@example.com" }]
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0.30,<3.0",
    "textual>=0.46.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0",
    "mypy>=1.10.0,<2.0",
    "ruff>=0.6.0,<0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
